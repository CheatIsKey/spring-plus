spring:
  config:
    import: optional:aws-parameterstore:/spring-plus/prod/

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${USERNAME}
    password: ${PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never   # MySQL에서는 data.sql 비활성화

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: ${BUCKET}


jwt:
  secret:
    key: ${SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: never

